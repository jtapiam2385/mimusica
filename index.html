<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#161616">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Mi Música</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#121212;--s1:#1c1c1c;--s2:#262626;--s3:#333;--tx:#f2f2f2;--tx2:#a9a9a9;--ac:#3d7bd9;--ac2:#e08a2c;--ok:#4caf7a;--bar:56px;--mini:68px;--sb:env(safe-area-inset-bottom,0px);--st:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.35 Roboto,system-ui,-apple-system,"Segoe UI",sans-serif}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select{font:inherit;color:var(--tx);background:var(--s2);border:1px solid var(--s3);border-radius:10px;padding:11px 12px;width:100%}
a{color:#7fb0ff}
svg.i{width:24px;height:24px;fill:currentColor;flex:none}
#bar{position:fixed;top:0;left:0;right:0;height:calc(var(--bar) + var(--st));padding-top:var(--st);display:flex;align-items:center;gap:4px;padding-left:4px;padding-right:4px;background:#161616;z-index:20;border-bottom:1px solid #222}
#bar .ib{width:48px;height:48px;display:grid;place-items:center;border-radius:50%;position:relative}
#bar .ib:active{background:var(--s2)}
#title{flex:1;font-size:19px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-left:6px}
.dot{position:absolute;top:10px;right:10px;width:9px;height:9px;border-radius:50%;background:var(--ac2)}
#view{padding:calc(var(--bar) + var(--st) + 8px) 0 calc(var(--mini) + var(--sb) + 90px)}
.pad{padding:0 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:16px 12px;padding:4px 14px}
.tile{display:block;text-align:left;min-width:0}
.cov{position:relative;width:100%;aspect-ratio:1;border-radius:8px;overflow:hidden;background:var(--s2);display:grid;place-items:center;color:#fff;font-weight:700;font-size:28px;letter-spacing:1px}
.cov img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cov .ph{padding:10px;text-align:center;font-size:15px;font-weight:600;line-height:1.2;text-shadow:0 1px 3px #0006;overflow:hidden;max-height:100%}
.tt{margin-top:7px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ts{color:var(--tx2);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row{display:flex;align-items:center;gap:14px;min-height:62px;padding:6px 6px 6px 16px;width:100%;text-align:left}
.row:active,.tile:active .cov{filter:brightness(1.25)}
.row .mid{flex:1;min-width:0}
.row .num{width:26px;color:var(--tx2);text-align:center;flex:none;font-size:14px}
.row .sq{width:48px;height:48px;border-radius:6px;font-size:15px;flex:none}
.sq .ph{font-size:9px;padding:3px;line-height:1.1}
.row .ic{width:44px;height:44px;border-radius:50%;background:var(--s2);display:grid;place-items:center;flex:none;color:var(--tx2)}
.row .more{width:44px;height:44px;display:grid;place-items:center;color:var(--tx2);flex:none;border-radius:50%}
.row.playing .tt2{color:#7fb0ff}
.tt2{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sec{font-size:13px;color:var(--tx2);text-transform:uppercase;letter-spacing:.08em;padding:18px 16px 6px}
.hero{display:flex;gap:16px;padding:8px 16px 14px;align-items:flex-end}
.hero .cov{width:132px;flex:none;font-size:20px}
.hero h1{font-size:21px;margin:0 0 4px;line-height:1.2}
.btns{display:flex;gap:10px;padding:4px 16px 10px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--s2);padding:10px 16px;border-radius:22px;font-weight:500}
.btn.pri{background:var(--ac)}
.btn.sm{padding:7px 12px;font-size:13px}
.btn:active{filter:brightness(1.3)}
.tabs{display:flex;gap:8px;padding:2px 16px 10px;overflow-x:auto}
.chip{padding:8px 14px;border-radius:18px;background:var(--s2);white-space:nowrap;font-size:14px}
.chip.on{background:var(--ac);color:#fff}
.card{background:var(--s1);border-radius:14px;margin:10px 14px;padding:14px 16px}
.card h3{margin:0 0 6px;font-size:16px}
.muted{color:var(--tx2)}
.small{font-size:13px}
.badge{display:inline-block;min-width:20px;padding:1px 7px;border-radius:10px;background:var(--ac2);color:#111;font-size:12px;font-weight:700;text-align:center}
.tag{display:inline-block;padding:1px 7px;border-radius:6px;background:var(--s3);font-size:11px;color:var(--tx2);margin-left:6px;vertical-align:1px}
.tag.new{background:var(--ac2);color:#111}
.tag.fut{background:#2d4f86;color:#dfe9ff}
.prog{height:6px;border-radius:3px;background:var(--s3);overflow:hidden;margin:8px 0}
.prog>i{display:block;height:100%;background:var(--ac);width:0;transition:width .3s}
.fab{position:fixed;right:18px;bottom:calc(var(--mini) + var(--sb) + 16px);width:58px;height:58px;border-radius:50%;background:var(--ac);display:grid;place-items:center;box-shadow:0 4px 14px #0008;z-index:15}
body.nomini .fab{bottom:calc(var(--sb) + 18px)}
#mini{position:fixed;left:0;right:0;bottom:0;height:calc(var(--mini) + var(--sb));padding-bottom:var(--sb);background:#1d1d1d;border-top:1px solid #2a2a2a;display:flex;align-items:center;gap:10px;padding-left:10px;padding-right:6px;z-index:16}
body.nomini #mini{display:none}
#mini .sq{width:48px;height:48px;border-radius:6px;font-size:14px;flex:none}
#mini .mid{flex:1;min-width:0}
#mini .pb{width:48px;height:48px;display:grid;place-items:center;border-radius:50%}
#mini .line{position:absolute;left:0;top:-1px;height:2px;background:var(--ac)}
#np{position:fixed;inset:0;background:linear-gradient(#26324a,#121212 55%);z-index:30;display:flex;flex-direction:column;padding:calc(var(--st) + 6px) 22px calc(var(--sb) + 18px);transform:translateY(100%);transition:transform .28s ease;visibility:hidden}
#np.open{transform:none;visibility:visible}
#np .top{display:flex;align-items:center;justify-content:space-between}
#np .top .ib{width:48px;height:48px;display:grid;place-items:center}
#np .art{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;padding:14px 0}
#np .art .cov{width:min(82vw,46vh,420px);font-size:30px;box-shadow:0 10px 40px #0009}
#np .meta{margin:6px 0 10px}
#np .meta .t{font-size:21px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#np .meta .a{color:var(--tx2);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#seek{width:100%;padding:0;background:none;border:0;accent-color:var(--ac);height:24px}
#np .times{display:flex;justify-content:space-between;color:var(--tx2);font-size:12px}
#np .ctl{display:flex;align-items:center;justify-content:space-between;margin-top:12px}
#np .ctl .ib{width:52px;height:52px;display:grid;place-items:center;border-radius:50%;color:var(--tx2)}
#np .ctl .ib.on{color:#7fb0ff}
#np .ctl .big{width:74px;height:74px;border-radius:50%;background:#fff;color:#111;display:grid;place-items:center}
#np .ctl .big svg{width:36px;height:36px}
#np .ctl .mid svg{width:34px;height:34px;color:var(--tx)}
#scrim{position:fixed;inset:0;background:#0009;z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
#scrim.on{opacity:1;pointer-events:auto}
#drawer{position:fixed;top:0;bottom:0;left:0;width:min(84vw,330px);background:#202020;z-index:41;transform:translateX(-102%);transition:transform .22s;overflow-y:auto;padding-top:var(--st);padding-bottom:var(--sb)}
#drawer.on{transform:none}
#drawer .hd{display:flex;align-items:center;gap:12px;padding:20px 18px 16px;border-bottom:1px solid #2c2c2c}
#drawer .hd img{width:46px;height:46px;border-radius:50%}
#drawer .it{display:flex;align-items:center;gap:22px;padding:15px 22px;width:100%;text-align:left;font-size:16px}
#drawer .it.on{background:#383838}
#drawer .it .badge{margin-left:auto}
#drawer hr{border:0;border-top:1px solid #2c2c2c;margin:6px 0}
#sheet{position:fixed;left:0;right:0;bottom:0;background:#242424;border-radius:16px 16px 0 0;z-index:41;transform:translateY(105%);transition:transform .22s;max-height:78vh;overflow-y:auto;padding:8px 0 calc(var(--sb) + 10px)}
#sheet.on{transform:none}
#sheet .sh{padding:10px 18px 8px;border-bottom:1px solid #333;margin-bottom:4px}
#sheet .op{display:flex;align-items:center;gap:18px;padding:14px 20px;width:100%;text-align:left}
#sheet .op:active{background:#333}
#toast{position:fixed;left:50%;bottom:calc(var(--mini) + var(--sb) + 88px);transform:translateX(-50%) translateY(20px);background:#eee;color:#111;padding:10px 16px;border-radius:10px;z-index:60;opacity:0;transition:.25s;max-width:88vw;font-size:14px;pointer-events:none}
#toast.on{opacity:1;transform:translateX(-50%)}
#banner{display:none;position:fixed;left:10px;right:10px;top:calc(var(--bar) + var(--st) + 6px);background:#3a2a12;border:1px solid #6b4a1c;border-radius:12px;padding:10px 12px;z-index:19;align-items:center;gap:10px;font-size:14px}
#banner.on{display:flex}
.search{padding:4px 14px 8px}
.empty{padding:40px 24px;text-align:center;color:var(--tx2)}
.kv{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid #2a2a2a}
.kv:last-child{border:0}
code.uri{display:block;background:#0d0d0d;border:1px solid #333;border-radius:8px;padding:10px;word-break:break-all;margin:6px 0;font-size:13px}
ol.steps{padding-left:20px;margin:8px 0}
ol.steps li{margin:7px 0}
label.sw{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 0}
label.sw input{width:22px;height:22px;accent-color:var(--ac)}
.field{margin:10px 0}
.field .lbl{font-size:13px;color:var(--tx2);margin-bottom:5px}
.spin{width:34px;height:34px;border:3px solid var(--s3);border-top-color:var(--ac);border-radius:50%;animation:sp 1s linear infinite;margin:0 auto 14px}
@keyframes sp{to{transform:rotate(360deg)}}
.sentinel{height:40px}
</style>
</head>
<body class="nomini">
<header id="bar">
  <button class="ib" id="bMenu" aria-label="Menú"></button>
  <div id="title">Mi Música</div>
  <button class="ib" id="bSearch" aria-label="Buscar"></button>
</header>
<div id="banner"><span style="flex:1" id="bannerTx"></span><button class="btn sm pri" id="bannerBtn">Conectar</button></div>
<main id="view"></main>
<button class="fab" id="fab" aria-label="Aleatorio"></button>
<div id="mini">
  <i class="line" id="miniLine"></i>
  <div class="cov sq" id="miniCov"></div>
  <div class="mid" id="miniMid"><div class="tt2" id="miniT"></div><div class="ts" id="miniA"></div></div>
  <button class="pb" id="miniPlay" aria-label="Reproducir"></button>
  <button class="pb" id="miniNext" aria-label="Siguiente"></button>
</div>
<section id="np" aria-label="Reproduciendo">
  <div class="top">
    <button class="ib" id="npClose" aria-label="Cerrar"></button>
    <div class="small muted" id="npFrom" style="text-align:center;flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis"></div>
    <button class="ib" id="npMore" aria-label="Opciones"></button>
  </div>
  <div class="art"><div class="cov" id="npCov"></div></div>
  <div class="meta"><div class="t" id="npT"></div><div class="a" id="npA"></div></div>
  <input type="range" id="seek" min="0" max="1000" value="0">
  <div class="times"><span id="tCur">0:00</span><span id="tDur">0:00</span></div>
  <div class="ctl">
    <button class="ib" id="npShuf" aria-label="Aleatorio"></button>
    <button class="ib mid" id="npPrev" aria-label="Anterior"></button>
    <button class="big" id="npPlay" aria-label="Reproducir"></button>
    <button class="ib mid" id="npNext" aria-label="Siguiente"></button>
    <button class="ib" id="npRep" aria-label="Repetir"></button>
  </div>
  <div style="display:flex;justify-content:center;margin-top:10px"><button class="btn sm" id="npQueue"></button></div>
</section>
<div id="scrim"></div>
<nav id="drawer"></nav>
<div id="sheet"></div>
<div id="toast"></div>

<script>
'use strict';
/* ====================== utilidades ====================== */
const $=(s,r=document)=>r.querySelector(s);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtT=s=>{if(!isFinite(s)||s<0)s=0;s=Math.floor(s);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const todayISO=()=>new Date().toISOString().slice(0,10);
const daysAgoISO=n=>new Date(Date.now()-n*864e5).toISOString().slice(0,10);
function norm(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/&/g,' and ').replace(/\s+y\s+/g,' and ').replace(/[^a-z0-9]+/g,' ').trim()}
function normTitle(s){return norm(String(s||'').replace(/\([^)]*\)|\[[^\]]*\]/g,' ')).replace(/\b(remaster(ed)?|deluxe|edition|edicion|expanded|anniversary|version|bonus|tracks?|reissue|special)\b/g,' ').replace(/^the\s+/,'').replace(/\s+/g,' ').trim()}
const akey=name=>norm(name).replace(/^the\s+/,'')||String(name);
function dice(a,b){if(a===b)return 1;if(a.length<2||b.length<2)return 0;const m=new Map();for(let i=0;i<a.length-1;i++){const g=a.substr(i,2);m.set(g,(m.get(g)||0)+1)}let n=0;for(let i=0;i<b.length-1;i++){const g=b.substr(i,2),c=m.get(g);if(c){m.set(g,c-1);n++}}return 2*n/(a.length+b.length-2)}
function hue(s){let h=0;for(const c of String(s))h=(h*31+c.charCodeAt(0))%360;return h}
function phStyle(s){const h=hue(s);return `background:linear-gradient(135deg,hsl(${h},45%,38%),hsl(${(h+50)%360},50%,22%))`}
const LS={get(k,d){try{const v=localStorage.getItem('mm.'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('mm.'+k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem('mm.'+k)}catch(e){}}};
const IDB={db:null,
  open(){if(this.db)return this.db;return this.db=new Promise((res,rej)=>{const r=indexedDB.open('mimusica',1);r.onupgradeneeded=()=>{r.result.createObjectStore('kv');r.result.createObjectStore('art')};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})},
  async tx(st,mode,fn){const db=await this.open();return new Promise((res,rej)=>{const t=db.transaction(st,mode);const q=fn(t.objectStore(st));t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error)})},
  async get(st,k){try{return await this.tx(st,'readonly',s=>s.get(k))}catch(e){return undefined}},
  async set(st,k,v){try{await this.tx(st,'readwrite',s=>s.put(v,k))}catch(e){console.warn('idb',e)}},
  async clear(st){try{await this.tx(st,'readwrite',s=>s.clear())}catch(e){}}
};

const AUTH='https://login.microsoftonline.com/consumers/oauth2/v2.0/';

const redirectUri=()=>location.origin+location.pathname.replace(/index\.html$/,'');
const b64u=buf=>btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const rnd=n=>{const a=new Uint8Array(n);crypto.getRandomValues(a);return b64u(a)};
const Auth={
  async login(silent){
    if(!S.settings.clientId){go('#/setup');return}
    const v=rnd(48),st=rnd(12);
    LS.set('pkce',{v,st,hash:location.hash,silent:!!silent});
    const ch=b64u(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(v)));
    const p=new URLSearchParams({client_id:S.settings.clientId,response_type:'code',redirect_uri:redirectUri(),response_mode:'query',scope:SCOPES,code_challenge:ch,code_challenge_method:'S256',state:st});

  },
  async handleRedirect(){
    const q=new URLSearchParams(location.search);
    if(!q.has('code')&&!q.has('error'))return;
    const pk=LS.get('pkce',null);LS.del('pkce');
    history.replaceState(null,'',redirectUri()+((pk&&pk.hash)||''));
    if(q.has('error')){if(!(pk&&pk.silent))toast('No se pudo iniciar sesión: '+(q.get('error_description')||q.get('error')).slice(0,140),6000);S.needLogin=true;return}
    if(!pk||pk.st!==q.get('state')){toast('Inicio de sesión inválido. Intenta de nuevo.');return}
    try{await this.tokenReq({grant_type:'authorization_code',code:q.get('code'),code_verifier:pk.v,redirect_uri:redirectUri()});toast('Conectado a OneDrive')}

  },
  async tokenReq(params){
    const body=new URLSearchParams(Object.assign({client_id:S.settings.clientId,scope:SCOPES},params));
    const r=await fetch(AUTH+'token',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body});
    const j=await r.json().catch(()=>({}));
    if(!r.ok)throw new Error(j.error_description?j.error_description.split('\r')[0]:(j.error||('HTTP '+r.status)));
    const old=LS.get('tok',{})||{};
    const t={at:j.access_token,rt:j.refresh_token||old.rt,exp:Date.now()+((j.expires_in||3600)-120)*1000};
    LS.set('tok',t);return t;
  },
  _ref:null,
  async token(){
    const t=LS.get('tok',null);
    if(!t)throw new AuthErr();
    if(Date.now()<t.exp)return t.at;
    if(!t.rt)throw new AuthErr();
    if(!this._ref)this._ref=this.tokenReq({grant_type:'refresh_token',refresh_token:t.rt}).finally(()=>{this._ref=null});

  },

};
async function gget(url,tries=0){
  const at=await Auth.token();
  const r=await fetch(url.startsWith('http')?url:GRAPH+url,{headers:{Authorization:'Bearer '+at}});
  if(r.status===401&&tries<1){const t=LS.get('tok',null);if(t){t.exp=0;LS.set('tok',t)}return gget(url,tries+1)}
  if((r.status===429||r.status===503||r.status===504)&&tries<6){await sleep((+r.headers.get('Retry-After')||2*(tries+1))*1000);return gget(url,tries+1)}

  return r.json();
}

const encPath=p=>p.split('/').map(encodeURIComponent).join('/');
async function scanLibrary(full){
  if(S.scan)return;
  S.scan={n:0,phase:'Buscando la carpeta de música…'};renderScanUI();
  try{
    const path='/'+S.settings.musicPath.replace(/^\/+|\/+$/g,'');
    let root;
    try{root=await gget('/me/drive/root:'+encPath(path)+'?$select=id,name')}
    catch(e){if(e.status===404)throw new Error('No encontré la carpeta "'+path+'" en tu OneDrive. Revísala en Ajustes.');throw e}
    let items=(!full&&S.rootId===root.id&&S.items)?Object.assign({},S.items):{};
    let link=(!full&&S.rootId===root.id&&LS.get('deltaLink',null))||`/me/drive/items/${root.id}/delta?$select=id,name,parentReference,file,folder,size,deleted`;
    S.scan.phase='Leyendo carpetas y canciones…';
    let deltaLink=null;
    try{
      for(;;){
        let j;
        try{j=await gget(link)}
        catch(e){if(e.status===410&&Object.keys(items).length){items={};link=`/me/drive/items/${root.id}/delta?$select=id,name,parentReference,file,folder,size,deleted`;continue}throw e}
        for(const it of j.value||[]){
          if(it.id===root.id)continue;
          if(it.deleted){delete items[it.id];continue}
          items[it.id]=[it.name,it.parentReference&&it.parentReference.id,it.folder?1:0,it.size||0];
          S.scan.n++;
        }
        renderScanUI();
        if(j['@odata.nextLink'])link=j['@odata.nextLink'];else{deltaLink=j['@odata.deltaLink'];break}
      }
    }catch(e){
      if(e instanceof AuthErr)throw e;
      console.warn('delta falló, uso recorrido de carpetas',e);
      items={};S.scan.n=0;S.scan.phase='Recorriendo carpetas (modo alternativo)…';
      await walkFolders(root.id,items);deltaLink=null;
    }
    S.items=items;S.rootId=root.id;
    await IDB.set('kv','items',items);LS.set('rootId',root.id);
    if(deltaLink)LS.set('deltaLink',deltaLink);else LS.del('deltaLink');
    LS.set('lastScan',Date.now());
    const before=S.lib?S.lib.trackList.length:-1;
    buildLib();
    S.scan=null;
    if(S.lib.trackList.length!==before)toast('Biblioteca lista: '+S.lib.trackList.length.toLocaleString('es-CL')+' canciones');
    if(before<0&&/^#\/(setup)?$|^$/.test(location.hash))location.hash='#/albums';else renderView(before>=0);
    setTimeout(()=>MB.run(false),3000);
  }catch(e){
    S.scan=null;
    if(e instanceof AuthErr){showBanner();route();return}
    toast(e.message,8000);route();
  }
}
async function walkFolders(rootId,items){
  const queue=[rootId];let active=0,err=null;
  await new Promise(res=>{
    const pump=()=>{
      if(err||(!queue.length&&!active))return res();
      while(active<6&&queue.length){
        const id=queue.shift();active++;
        (async()=>{let url=`/me/drive/items/${id}/children?$select=id,name,folder,file,size&$top=999`;
          while(url){const j=await gget(url);for(const it of j.value||[]){items[it.id]=[it.name,id,it.folder?1:0,it.size||0];S.scan.n++;if(it.folder)queue.push(it.id)}url=j['@odata.nextLink']}
        })().catch(e=>{err=e}).finally(()=>{active--;renderScanUI();pump()});
      }
    };pump();
  });
  if(err)throw err;
}
function parseAlbum(name){

  m=name.match(/^(.+?)\s*[(\[](\d{4})[)\]]\s*$/);if(m)return{y:+m[2],t:m[1].trim()};
  return{y:null,t:name.trim()};
}
function parseTrack(f){

}

      if(artistName){const k=akey(artistName);const R=artists[k]||(artists[k]={k,name:artistName,al:[],cats:[]});R.al.push(albumId);if(!R.cats.includes(cat))R.cats.push(cat)}}

function addEmptyAlbums(items,root,chain,albums,artists){const has={};for(const id in items){const it=items[id];if(it[2]||!AUDIO_RE.test(it[0]))continue;let c=it[1];while(c&&c!==root&&!has[c]){has[c]=1;c=items[c]&&items[c][1]}}const AP=/^\s*\d{4}\s*[-–—._]\s*\S/;for(const id in items){const it=items[id];if(!it[2]||has[id]||albums[id]||!AP.test(it[0]))continue;const p=items[it[1]];if(p&&AP.test(p[0]))continue;const ch=chain(id);if(!ch||ch.length<2)continue;const ai=ch.length-1;let ax=1;while(ai>ax+1&&/^(discograf[ií]as? varias|varios|various( artists)?|compilados?)$/i.test(items[ch[ax]][0].trim()))ax++;const an=ai>ax?items[ch[ax]][0]:null;const pa=parseAlbum(it[0]);albums[id]={id,t:pa.t,y:pa.y,ar:an?akey(an):null,arn:an,cat:items[ch[0]][0],tr:[],sz:0,empty:true};if(an){const k=akey(an);const R=artists[k]||(artists[k]={k,name:an,al:[],cats:[]});R.al.push(id);if(!R.cats.includes(items[ch[0]][0]))R.cats.push(items[ch[0]][0])}}}function sortAlbumTracks(A,tracks){

async function notifyNew(found){
  const names=found.slice(0,4).map(f=>`${S.lib.artists[f.k].name}: ${f.rg.t}`).join('\n');
  const title=found.length===1?`Nuevo disco de ${S.lib.artists[found[0].k].name}`:`${found.length} discos nuevos de tus artistas`;
  toast(title,5000);
  if(!('Notification' in window)||Notification.permission!=='granted')return;
  try{const reg=navigator.serviceWorker&&await navigator.serviceWorker.getRegistration();
    if(reg)reg.showNotification(title,{body:names,icon:'icon-192.png',badge:'icon-192.png',tag:'novedades',data:{url:'#/alerts'}});
    else new Notification(title,{body:names,icon:'icon-192.png'});}catch(e){}
}

let chunk=null;
const chunkObs=('IntersectionObserver' in window)?new IntersectionObserver(es=>{for(const e of es)if(e.isIntersecting)moreChunk()},{rootMargin:'600px'}):null;
function chunked(items,renderOne,wrapCls,size=80){
  chunk={items,renderOne,pos:0,size,wrapCls};
  return `<div class="${wrapCls}" id="chunkWrap"></div><div class="sentinel" id="chunkSent"></div>`;
}
function moreChunk(){
  if(!chunk)return;const w=$('#chunkWrap');if(!w)return;
  const end=Math.min(chunk.items.length,chunk.pos+chunk.size);if(chunk.pos>=end)return;
  const html=[];for(let i=chunk.pos;i<end;i++)html.push(chunk.renderOne(chunk.items[i],i));
  chunk.pos=end;w.insertAdjacentHTML('beforeend',html.join(''));hydrateCovers(w);
  if(P.cur())w.querySelectorAll(`.row[data-tid="${P.cur()}"]`).forEach(r=>r.classList.add('playing'));
}
const albumTile=A=>`<button class="tile"${A.empty?' style="opacity:.5"':''} data-go="#/album/${A.id}">${coverHTML(A)}<div class="tt">${esc(A.t)}</div><div class="ts">${A.empty?'<span class="tag fut" style="margin:0 4px 0 0">Pendiente</span>':''}${esc(albumArtist(A))}${A.y?' · '+A.y:''}</div></button>`;
function trackRow(id,i,listKey,opts={}){
  const t=S.lib.tracks[id];if(!t)return'';const A=S.lib.albums[t.a];const g=S.tags[id]||{};
  const left=opts.num?`<span class="num">${g.n||t.n||(i+1)}</span>`:opts.cover?coverHTML(A,'sq'):'';
  const sub=opts.num?(g.ar&&g.ar!==albumArtist(A)?g.ar:''):`${trackArtist(t)} · ${A.t}`;
  return `<div class="row${P.cur()===id?' playing':''}" data-tid="${id}"><button class="mid" style="display:flex;gap:14px;align-items:center;text-align:left;min-width:0" data-play="${esc(listKey)}" data-i="${i}">${left}<span style="min-width:0;flex:1"><div class="tt2">${esc(trackTitle(t))}</div>${sub?`<div class="ts">${esc(sub)}</div>`:''}</span></button><button class="more" data-tmenu="${id}">${ic('more')}</button></div>`;
}
function listFor(key){
  const L=S.lib;if(!L)return[];
  const [k,...r]=key.split(':');const v=r.join(':');
  if(k==='album')return (L.albums[v]||{tr:[]}).tr.slice();
  if(k==='songs')return L.trackList;
  if(k==='artist'){const R=L.artists[v];return R?[].concat(...R.al.map(a=>L.albums[a].tr)):[]}
  if(k==='pl'){const p=S.playlists.find(x=>x.id===v);return p?p.tracks.filter(id=>L.tracks[id]):[]}
  if(k==='folder')return (L.children[v]||[]).filter(id=>L.tracks[id]).sort((a,b)=>L.coll.compare(S.items[a][0],S.items[b][0]));
  if(k==='search')return S.lastSearch||[];
  if(k==='queue')return P.q;
  return[];
}
function fromLabel(key){const[k,...r]=key.split(':');const v=r.join(':');const L=S.lib;
  if(k==='album')return 'Álbum · '+(L.albums[v]?L.albums[v].t:'');if(k==='artist')return 'Artista · '+(L.artists[v]?L.artists[v].name:'');
  if(k==='songs')return 'Todas las canciones';if(k==='pl'){const p=S.playlists.find(x=>x.id===v);return 'Lista · '+(p?p.name:'')}
  if(k==='folder')return 'Carpeta · '+(S.items[v]?S.items[v][0]:'');return ''}

function missRow(rg,k){return `<div class="row" style="padding-left:16px"><span class="mid"><div class="tt2">${esc(rg.t)}${rg._p?'<span class="tag fut">Carpeta creada</span>':''}${rg.pt==='EP'?'<span class="tag">EP</span>':''}${(rg.st||[]).map(s=>`<span class="tag">${esc(stName(s))}</span>`).join('')}</div><div class="ts">${fmtDate(rg.d)}</div></span><button class="more" data-rgmenu="${rg.id}" data-k="${esc(k||'')}">${ic('more')}</button></div>`}
const stName=s=>({Live:'En vivo',Compilation:'Recopilatorio',Soundtrack:'Banda sonora',Remix:'Remix'}[s]||s);
function fmtDate(d){if(!d)return'';const p=d.split('-');const M=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];return p.length===3?`${+p[2]} ${M[+p[1]-1]} ${p[0]}`:p.length===2?`${M[+p[1]-1]} ${p[0]}`:p[0]}
function notFound(){setTitle('Mi Música');return '<div class="empty">No encontrado.</div>'}
let isSub=false;
function setTitle(t,sub){$('#title').textContent=t;isSub=!!sub;$('#bMenu').innerHTML=ic(sub?'back':'menu')+(S.newsN&&!sub?'<i class="dot"></i>':'')}

/* ====================== router ====================== */
function go(h){if(location.hash===h)route();else location.hash=h}
function route(){renderView(false)}
function renderView(keepScroll){
  const v=$('#view');const y=window.scrollY;
  const h=location.hash.replace(/^#\/?/,'');const[name,...rest]=h.split('/');const arg=rest.join('/');
  chunk=null;
  let html;
  if(S.scan&&!S.lib){html=scanHTML();setTitle('Mi Música')}
  else if(!S.lib&&!S.demo){html=name==='settings'?VIEWS.settings():VIEWS.setup()}
  else if(name==='setup'){html=VIEWS.setup()}
  else{const fn=VIEWS[name||'albums']||VIEWS.albums;html=fn(arg)}
  v.innerHTML=html;
  if(chunk){moreChunk();const s=$('#chunkSent');if(s&&chunkObs)chunkObs.observe(s)}
  hydrateCovers(v);
  window.scrollTo(0,keepScroll?y:0);
  $('#fab').style.display=(['albums','artists','songs','artist','album',''].includes(name)&&S.lib)?'':'none';
  renderDrawer();
  if(name==='search'){const q=$('#q');q.addEventListener('input',()=>doSearch(q.value));if(S.lastQ)doSearch(S.lastQ);else setTimeout(()=>q.focus(),50)}
}
window.addEventListener('hashchange',route);
function scanHTML(){return `<div class="empty"><div class="spin"></div><div style="color:var(--tx);font-size:17px;margin-bottom:6px">Leyendo tu biblioteca</div><div id="scanTx">${esc(S.scan.phase)}<br>${S.scan.n.toLocaleString('es-CL')} elementos encontrados</div><div class="ts" style="margin-top:12px">La primera vez puede tardar unos minutos. Después se actualiza sola.</div></div>`}
function renderScanUI(){if(S.lib||!S.scan)return;const el=$('#scanTx');if(el)el.innerHTML=esc(S.scan.phase)+'<br>'+S.scan.n.toLocaleString('es-CL')+' elementos encontrados';else route()}
function refreshAlertsLive(full){
  if(!location.hash.startsWith('#/alerts'))return;
  if(full)return renderView(true);
  const el=$('#mbStatus');if(el&&MB.running)el.innerHTML=`<div class="small">Revisando discografías… <b>${MB.done}</b> de ${MB.total}${MB.cur?' · '+esc(MB.cur):''}</div><div class="prog"><i style="width:${MB.total?MB.done/MB.total*100:0}%"></i></div><div class="ts">Puedes seguir usando la app mientras tanto.</div>`;
  if(MB.done%10===0)renderView(true);
}
function doSearch(q){
  S.lastQ=q;const r=$('#sres');if(!r)return;const n=norm(q);
  if(n.length<2){r.innerHTML='';return}
  const L=S.lib;const has=s=>norm(s).includes(n);
  const ar=L.artistList.filter(a=>has(a.name)).slice(0,20);
  const al=L.albumList.filter(a=>has(a.t)||has(albumArtist(a))&&!ar.length).slice(0,40);
  const tr=[];for(const id of L.trackList){if(has(trackTitle(L.tracks[id])))tr.push(id);if(tr.length>=100)break}
  S.lastSearch=tr;
  r.innerHTML=(ar.length?'<div class="sec">Artistas</div>'+ar.map(a=>`<button class="row" data-go="#/artist/${encodeURIComponent(a.k)}"><span class="ic">${ic('mic')}</span><span class="mid"><div class="tt2">${esc(a.name)}</div><div class="ts">${a.al.length} álbumes</div></span></button>`).join(''):'')+
    (al.length?'<div class="sec">Álbumes</div><div class="grid">'+al.map(albumTile).join('')+'</div>':'')+
    (tr.length?'<div class="sec">Canciones</div>'+tr.map((id,i)=>trackRow(id,i,'search',{cover:false})).join(''):'')+
    (!ar.length&&!al.length&&!tr.length?'<div class="empty">Sin resultados</div>':'');
  hydrateCovers(r);
}

/* ====================== menú lateral y hojas ====================== */

  $('#drawer').innerHTML=`<div class="hd"><img src="icon-192.png" alt=""><div><div style="font-weight:600;font-size:17px">Mi Música</div><div class="ts">${S.demo?'Modo demo':'OneDrive'}</div></div></div>`+
    it('albums','album','Álbumes')+it('artists','mic','Artistas')+it('playlists','plist','Listas de reproducción')+it('folders','folder','Carpetas')+it('songs','note','Canciones')+
    it('alerts','bell','Alertas',S.newsN?`<span class="badge">${S.newsN}</span>`:'')+'<hr>'+
    `<button class="it" data-act="rescan">${ic('refresh')}<span>Actualizar biblioteca</span></button>`+it('settings','gear','Ajustes');
}
function openDrawer(){$('#drawer').classList.add('on');$('#scrim').classList.add('on')}
function closeAll(){$('#drawer').classList.remove('on');$('#sheet').classList.remove('on');$('#scrim').classList.remove('on')}

function sheet(head,ops){

  $('#sheet').onclick=e=>{const b=e.target.closest('[data-op]');if(!b)return;closeAll();ops[+b.dataset.op].fn()};

function trackMenu(id,plid){
  const t=S.lib.tracks[id];const A=S.lib.albums[t.a];
  const ops=[{icon:'nextup',label:'Reproducir a continuación',fn:()=>P.playNext([id])},{icon:'qadd',label:'Añadir a la cola',fn:()=>P.enqueue([id])},{icon:'padd',label:'Añadir a una lista',fn:()=>addToPlaylist([id])},{icon:'album',label:'Ir al álbum',fn:()=>go('#/album/'+A.id)}];
  if(A.ar)ops.push({icon:'mic',label:'Ir al artista',fn:()=>go('#/artist/'+encodeURIComponent(A.ar))});
  if(plid)ops.push({icon:'del',label:'Quitar de esta lista',fn:()=>{const p=S.playlists.find(x=>x.id===plid);const k=p.tracks.indexOf(id);if(k>=0)p.tracks.splice(k,1);savePl();renderView(true)}});
  sheet(`<div class="tt2" style="font-weight:600">${esc(trackTitle(t))}</div><div class="ts">${esc(trackArtist(t))} · ${esc(A.t)}</div>`,ops);
}
function albumMenu(id){const A=S.lib.albums[id];
  sheet(`<div class="tt2" style="font-weight:600">${esc(A.t)}</div><div class="ts">${esc(albumArtist(A))}</div>`,[
    {icon:'nextup',label:'Reproducir a continuación',fn:()=>P.playNext(A.tr)},{icon:'qadd',label:'Añadir a la cola',fn:()=>P.enqueue(A.tr)},{icon:'padd',label:'Añadir a una lista',fn:()=>addToPlaylist(A.tr)},{icon:'folder',label:'Abrir carpeta',fn:()=>go('#/folders/'+id)}]);
}
function rgMenu(rgid,k){
  let rg=null;for(const kk in S.mb){const m=S.mb[kk];if(m.rgs){const f=m.rgs.find(r=>r.id===rgid);if(f){rg=f;if(!k)k=kk;break}}}
  if(!rg)return;const R=S.lib.artists[k];
  const q=encodeURIComponent((R?R.name+' ':'')+rg.t);
  sheet(`<div class="tt2" style="font-weight:600">${esc(rg.t)}</div><div class="ts">${esc(R?R.name:'')} · ${fmtDate(rg.d)}</div>`,[
    {icon:'link',label:'Ver en MusicBrainz',fn:()=>window.open('https://musicbrainz.org/release-group/'+rg.id,'_blank')},
    {icon:'search',label:'Buscar en YouTube',fn:()=>window.open('https://www.youtube.com/results?search_query='+q,'_blank')},
    {icon:'check',label:'Ya lo tengo / ignorar este disco',fn:()=>{S.ignored[rg.id]=1;LS.set('ignored',S.ignored);updateBadge();renderView(true);toast('No volverá a aparecer',1500)}},
    ...(R?[{icon:'mic',label:'Ver artista',fn:()=>go('#/artist/'+encodeURIComponent(k))}]:[])]);
}
async function fixArtist(k){
  const R=S.lib.artists[k];const m=S.mb[k]||(S.mb[k]={});
  if(!m.cands){toast('Buscando en MusicBrainz…',1500);try{m.cands=(await MB.search(R.name)).slice(0,6)}catch(e){toast('Sin conexión con MusicBrainz');return}}
  const choose=c=>{Object.assign(m,{mbid:c.id,mbn:c.name,dis:c.dis,nomatch:false,skip:false,rgs:null});toast('Revisando '+c.name+'…',1500);
    MB.checkArtist(k).then(()=>{saveMB();updateBadge();renderView(true)}).catch(e=>toast(e.message))};
  sheet(`<div style="font-weight:600">¿Cuál es "${esc(R.name)}"?</div><div class="ts">Resultados de MusicBrainz</div>`,[
    ...m.cands.map(c=>({icon:'mic',html:`<div class="tt2">${esc(c.name)}${c.id===m.mbid?' ✓':''}</div><div class="ts">${esc([c.dis,c.country].filter(Boolean).join(' · ')||'—')}</div>`,fn:()=>choose(c)})),
    {icon:'search',label:'Buscar con otro nombre…',fn:async()=>{const q=prompt('Nombre del artista en MusicBrainz',R.name);if(!q)return;try{m.cands=(await MB.search(q)).slice(0,6);fixArtist(k)}catch(e){toast(e.message)}}},
    {icon:'hide',label:'No revisar este artista',fn:()=>{m.skip=true;saveMB();updateBadge();renderView(true)}}]);
}
const savePl=()=>LS.set('playlists',S.playlists);
function addToPlaylist(ids){
  const add=p=>{p.tracks.push(...ids);savePl();toast('Añadido a "'+p.name+'"',1500)};
  sheet('<div style="font-weight:600">Añadir a una lista</div>',[{icon:'padd',label:'Nueva lista…',fn:()=>{const p=newPlaylist();if(p)add(p)}},...S.playlists.map(p=>({icon:'plist',label:p.name,fn:()=>add(p)}))]);
}
function newPlaylist(){const n=prompt('Nombre de la lista');if(!n||!n.trim())return null;const p={id:Date.now().toString(36),name:n.trim(),tracks:[]};S.playlists.push(p);savePl();return p}
function queueSheet(){
  const L=P.q;const start=Math.max(0,P.i-2);
  sheet(`<div style="font-weight:600">Cola de reproducción</div><div class="ts">${L.length} canciones</div>`,L.slice(start,start+60).map((id,j)=>{const t=S.lib.tracks[id];const k=start+j;return t?{icon:k===P.i?'play':'note',html:`<div class="tt2"${k===P.i?' style="color:#7fb0ff"':''}>${esc(trackTitle(t))}</div><div class="ts">${esc(trackArtist(t))}</div>`,fn:()=>P.load(k)}:null}).filter(Boolean));
}

/* ====================== eventos ====================== */
document.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]');if(g){closeAll();go(g.dataset.go);return}
  const pl=e.target.closest('[data-play]');if(pl){const k=pl.dataset.play;const L=listFor(k);P.play(L,+pl.dataset.i||0,{from:fromLabel(k)});return}
  const sh=e.target.closest('[data-shuf]');if(sh){const k=sh.dataset.shuf;P.play(listFor(k),0,{shuffle:true,from:fromLabel(k)});return}
  const tm=e.target.closest('[data-tmenu]');if(tm){const h=location.hash.match(/^#\/pl\/(.+)$/);trackMenu(tm.dataset.tmenu,h&&h[1]);return}
  const am=e.target.closest('[data-amenu]');if(am){albumMenu(am.dataset.amenu);return}
  const rm=e.target.closest('[data-rgmenu]');if(rm){rgMenu(rm.dataset.rgmenu,rm.dataset.k);return}
  const so=e.target.closest('[data-sort]');if(so){S.albumSort=so.dataset.sort;LS.set('albumSort',S.albumSort);sortAlbums();renderView(false);return}
  const at=e.target.closest('[data-atab]');if(at){S.alertTab=at.dataset.atab;renderView(true);return}
  const a=e.target.closest('[data-act]');if(!a)return;
  const k=a.dataset.k;
  switch(a.dataset.act){
    case'rescan':closeAll();if(S.demo){toast('Modo demo');break}scanLibrary(false);break;
    case'fullscan':if(confirm('¿Leer toda la biblioteca desde cero?'))scanLibrary(true);break;
    case'ashuf':playRandomAlbum();break;case'mbrun':if(S.demo){toast('En modo demo no se consulta MusicBrainz');break}MB.run(true);setTimeout(()=>renderView(true),100);break;
    case'checkone':toast('Revisando…',1200);MB.checkArtist(k).then(()=>{saveMB();updateBadge();renderView(true)}).catch(err=>toast(err.message));break;
    case'notif':Notification.requestPermission().then(p=>{toast(p==='granted'?'Avisos activados':'Avisos no permitidos');renderView(true)});break;
    case'fixartist':fixArtist(k);break;
    case'skip':(S.mb[k]||(S.mb[k]={})).skip=true;saveMB();updateBadge();renderView(true);break;
    case'unskip':if(S.mb[k])S.mb[k].skip=false;saveMB();toast('Se revisará en la próxima pasada');renderView(true);break;
    case'newpl':if(newPlaylist())renderView(true);break;
    case'renpl':{const p=S.playlists.find(x=>x.id===a.dataset.id);const n=prompt('Nuevo nombre',p.name);if(n&&n.trim()){p.name=n.trim();savePl();renderView(true)}break}
    case'delpl':if(confirm('¿Eliminar esta lista?')){S.playlists=S.playlists.filter(x=>x.id!==a.dataset.id);savePl();go('#/playlists')}break;
    case'clearign':S.ignored={};LS.set('ignored',{});updateBadge();renderView(true);break;
    case'logout':Auth.logout();toast('Sesión cerrada');renderView(true);break;
    case'login':Auth.login(false);break;
    case'copyuri':navigator.clipboard&&navigator.clipboard.writeText(redirectUri()).then(()=>toast('Dirección copiada'),()=>toast('Mantén presionada la dirección para copiarla'));break;
    case'setupgo':{const cid=$('#cid').value.trim();if(!/^[0-9a-f-]{36}$/i.test(cid)){toast('El ID debe tener el formato xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx');break}
      S.settings.clientId=cid;S.settings.musicPath=$('#mpath').value.trim()||DEF.musicPath;saveSettings();
      if(Auth.logged()&&!S.lib)scanLibrary(true);else Auth.login(false);break}
  }
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.set){S.settings[t.dataset.set]=t.checked;saveSettings();updateBadge()}
  else if(t.dataset.setn){S.settings[t.dataset.setn]=+t.value;saveSettings();updateBadge()}
  else if(t.id==='setPath'){const v=t.value.trim();if(v&&v!==S.settings.musicPath){S.settings.musicPath=v;saveSettings();toast('Carpeta cambiada. Pulsa "Leer todo de nuevo".')}}
  else if(t.id==='setCid'){const v=t.value.trim();if(v!==S.settings.clientId){S.settings.clientId=v;saveSettings();Auth.logout();toast('ID guardado. Inicia sesión de nuevo.');renderView(true)}}
});
$('#bMenu').onclick=()=>{if(isSub)history.length>1?history.back():go('#/albums');else openDrawer()};
$('#bSearch').onclick=()=>go('#/search');
$('#fab').onclick=()=>{const h=location.hash.replace(/^#\/?/,'');const[n,...r]=h.split('/');const arg=r.join('/');

$('#npClose').innerHTML=ic('down');$('#npMore').innerHTML=ic('more');$('#npPrev').innerHTML=ic('prev');$('#npNext').innerHTML=ic('next');$('#npShuf').innerHTML=ic('shuffle');$('#npRep').innerHTML=ic('repeat');
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&S.lib&&!S.demo){const last=LS.get('lastScan',0);if(Date.now()-last>6*3600e3&&Auth.logged())scanLibrary(false);MB.run(false)}});

/* ====================== demo ====================== */
function loadDemo(){
  const data={'Discografías completas':{'ABBA':['1974 - Waterloo','1976 - Arrival','1977 - The Album','1979 - Voulez-Vous'],'Los Jaivas':['1972 - La Ventana','1981 - Alturas de Machu Picchu'],'Soda Stereo':['1984 - Soda Stereo','1986 - Signos','1988 - Doble Vida','1990 - Canción Animal']},
    'Discografías por completar':{'Aerosmith':['1973 - Aerosmith','1975 - Toys In The Attic','1976 - Rocks','1989 - Pump','1998 - A little south of sanity'],'A-Ha':['1985 - Hunting High and Low','1986 - Scoundrel Days'],'Violeta Parra':['1966 - Las últimas composiciones']},
    'Discografías en vinilos':{'_':['1959 - Kind Of Blue','1973 - Cueca de la libertad']}};
  const items={};let n=0;const id=()=> 'd'+(n++);const root='root';S.rootId=root;
  for(const cat in data){const c=id();items[c]=[cat,root,1,0];
    for(const ar in data[cat]){const parent=ar==='_'?c:(()=>{const a=id();items[a]=[ar,c,1,0];return a})();
      for(const al of data[cat][ar]){const f=id();items[f]=[al,parent,1,0];
        if(/south of sanity/.test(al)){for(const d of[1,2]){const cd=id();items[cd]=[al+' CD'+d,f,1,0];for(let t=1;t<=5;t++)items[id()]=[`Canción ${t} (CD${d}).mp3`,cd,0,5e6]}}
        else for(let t=1;t<=6+(al.length%5);t++)items[id()]=[`${String(t).padStart(2,'0')} - Canción de ejemplo ${t}.mp3`,f,0,6e6]}}}
  S.items=items;buildLib();
  const fake=(t,d,pt='Album',st=[])=>({id:'rg'+(n++),t,d,pt,st});
  S.mb[akey('Aerosmith')]={mbid:'x',mbn:'Aerosmith',rgs:[fake('Aerosmith',''+'1973-01-05'),fake('Get Your Wings','1974-03-01'),fake('Toys in the Attic','1975-04-08'),fake('Rocks','1976-05-03'),fake('Draw the Line','1977-12-01'),fake('Pump','1989-09-12'),fake('Disco nuevo de ejemplo',daysAgoISO(20))]};
  S.mb[akey('A-Ha')]={mbid:'y',mbn:'a‐ha',rgs:[fake('Hunting High and Low','1985-06-01'),fake('Scoundrel Days','1986-10-06'),fake('Stay on These Roads','1988-05-02'),fake('Próximo disco de ejemplo',new Date(Date.now()+40*864e5).toISOString().slice(0,10))]};
  S.mb[akey('Violeta Parra')]={nomatch:true,cands:[]};
  for(const R of S.lib.artistList)if(!S.mb[R.k])S.mb[R.k]={mbid:'z',mbn:R.name,rgs:R.al.map(a=>fake(S.lib.albums[a].t,(S.lib.albums[a].y||2000)+'-01-01'))};
  LS.set('mbLast',Date.now());
}
const demoUrls={};
function demoUrl(id){
  if(demoUrls[id])return demoUrls[id];
  const sr=8000,sec=20,len=sr*sec,buf=new ArrayBuffer(44+len*2),v=new DataView(buf);
  const w=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i))};
  w(0,'RIFF');v.setUint32(4,36+len*2,true);w(8,'WAVE');w(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,sr,true);v.setUint32(28,sr*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,'data');v.setUint32(40,len*2,true);
  const f=220+(hue(id)%24)*20;
  for(let i=0;i<len;i++){const t=i/sr;const env=Math.min(1,t*4)*Math.min(1,(sec-t)*2)*(0.6+0.4*Math.sin(t*3));v.setInt16(44+i*2,Math.sin(2*Math.PI*f*t)*env*6000,true)}
  return demoUrls[id]=URL.createObjectURL(new Blob([buf],{type:'audio/wav'}));
}

/* ====================== inicio ====================== */
async function init(){
  S.demo=new URLSearchParams(location.search).has('demo');
  if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
  if(S.demo){loadDemo();S.newsN=computeAlerts().news.length;P.q=[];P.i=-1}
  else{
    await Auth.handleRedirect();
    S.rootId=LS.get('rootId',null);
    const [items,tags,mb]=await Promise.all([IDB.get('kv','items'),IDB.get('kv','tags'),IDB.get('kv','mb')]);
    S.tags=tags||{};S.mb=mb||{};if(LS.get('critV',0)<2){for(const k in S.mb)S.mb[k].checked=0;LS.set('critV',2);S.settings.live=true;S.settings.ost=true;S.settings.comp=false;S.settings.eps=false;S.settings.other=false;saveSettings()}
    if(items&&S.rootId){S.items=items;try{buildLib()}catch(e){console.error(e);S.lib=null}}
    if(S.lib)updateBadge();
  }
  if(!S.lib||!S.lib.tracks[P.cur()]){P.q=[];P.i=-1}
  updatePlayerUI();
  if(!location.hash&&S.lib)history.replaceState(null,'','#/albums');
  route();
  if(S.demo){toast('Modo demo: datos de ejemplo',3000);return}
  if(!S.settings.clientId){go('#/setup');return}
  if(!Auth.logged()){
    let tried=false;try{tried=sessionStorage.getItem('mm.silent')}catch(e){}
    if(!tried&&!S.needLogin){try{sessionStorage.setItem('mm.silent','1')}catch(e){}Auth.login(true);return}
    if(S.lib)showBanner('Conéctate a Microsoft para reproducir.');else go('#/setup');return;
  }
  if(!S.lib){scanLibrary(true);return}
  const last=LS.get('lastScan',0);
  if(Date.now()-last>6*3600e3)setTimeout(()=>scanLibrary(false),1500);
  setTimeout(()=>MB.run(false),5000);
}
init();
